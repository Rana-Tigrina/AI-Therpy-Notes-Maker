name: CI - Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Run Linting & Automated Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint Code with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,build,dist
          # Treat formatting warnings leniently in CI
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=130 --statistics --exclude=venv,.venv,build,dist

      - name: Run Automated Unit Tests
        env:
          GEMINI_API_KEY: "mock_ci_test_key"
          NOTE_GENERATION_MODEL: "gemma-4-31b-it"
          GEMINI_ASR_MODEL: "gemini-3.1-flash-lite"
          FALLBACK_MODEL: "gemini-2.5-flash"
          ENABLE_DEMO_LIMITS: "true"
          MAX_AUDIO_DURATION_SEC: "60"
          MAX_USER_UPLOADS: "2"
        run: |
          python -m unittest discover -s tests -v

  docker-build-check:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: therapy-notes-maker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
